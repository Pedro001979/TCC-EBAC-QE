name: Mobile Android E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-catalog:
    name: EBAC Store catalog (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Mobile dependencies
        run: |
          npm ci --prefix Mobile

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash .github/scripts/run-mobile-android-e2e.sh

      - name: Generate Allure report
        if: always()
        working-directory: Mobile
        run: |
          if [ -n "$(find allure-results -type f -print -quit 2>/dev/null)" ]; then
            npm run report
          else
            echo "No Allure results were produced."
          fi

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-allure-${{ github.run_number }}
          path: |
            Mobile/allure-results/
            Mobile/allure-report/
            ${{ runner.temp }}/appium.log
          if-no-files-found: warn
          retention-days: 14
